services:
  mongo:
    image: mongo:7.0
    container_name: mongo

    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}

    volumes:
      - mongo_data:/data/db

    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis

    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - yes

    volumes:
      - redis_data:/data

    networks:
      - app-network

  backend:
    image: keyurp0207/support-backend:latest
    container_name: backend

    env_file:
      - .env

    depends_on:
      - mongo
      - redis

    restart: unless-stopped

    networks:
      - app-network

  frontend:
    image: keyurp0207/support-frontend:latest
    container_name: frontend

    depends_on:
      - backend

    ports:
      - "5173:80"

    restart: unless-stopped

    networks:
      - app-network

volumes:
  mongo_data:
  redis_data:

networks:
  app-network:
    driver: bridge